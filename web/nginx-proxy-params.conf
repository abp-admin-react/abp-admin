# 反代公共头（被 nginx.conf 的各后端 location include）。
# Host 必须传浏览器原始 Host（默认 $proxy_host 会把 host:8080 泄给后端，
# 请求派生 URL 就指错源）；X-Forwarded-* 供后端 UseForwardedHeaders
# （管道最前已启用，见 backend/etc/nginx/signalr-hubs.conf 注释）还原真实协议/主机。
proxy_http_version 1.1;
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
# $backend_forwarded_proto = nginx.conf 的 map：上游带了 X-Forwarded-Proto 就透传，
# 直连本层才回落本层 scheme（固定 $scheme 会把外层 https 覆盖成 http，见 nginx.conf map 段说明）
proxy_set_header X-Forwarded-Proto $backend_forwarded_proto;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Port $server_port;

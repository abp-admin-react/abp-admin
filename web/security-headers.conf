# SPA 侧安全响应头（安全审计 H-5，由 nginx.conf 的两个静态/回退 location include）。
# 反代路径（/api /connect /Account …）不用本文件：后端自带 ABP 安全头，重复下发会出现同头双值。
#
# CSP 口径（2026-10-19 决策：不做资源源限制）：
# 只保留 ABP 官方默认三条防框嵌/防插件指令——与后端 AbpSecurityHeadersOptions
# （UseContentSecurityPolicyHeader，b8c965d）完全同款，也与 abp.io 官网姿态一致
# （官网仅 frame-ancestors）。刻意不含 default-src/script-src/img-src/font-src/
# connect-src：本站纯 HTTP 起步、外部资源形态不可枚举（模板外链图床、协议相对
# 字体地址、后续新模块皆未知），限制类指令一上就裂图/丢字体（10-18/10-19 两轮
# 实证），维护成本高于收益。XSS 防线交给脚本同源构建 + 框架输出编码。
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "object-src 'none'; form-action 'self'; frame-ancestors 'none'" always;

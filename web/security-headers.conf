# SPA 侧安全响应头（安全审计 H-5，由 nginx.conf 的两个静态/回退 location include）。
# 反代路径（/api /connect /Account …）不用本文件：后端自带 ABP 安全头，重复下发会出现同头双值。
#
# CSP 口径（贴合 umi/Ant Design Pro 的实际资源形态）：
# - script-src 'self'：构建产物脚本全部同源（2026-10-10 已对 dist 实测核验：
#   index.html 无内联 <script>、无外链脚本/字体/图片资源），禁止内联/eval/外部注入
# - style-src 附 'unsafe-inline'：antd 组件大量内联样式，无法收严
# - img-src：同源 + data:/blob:（头像占位、运行时生成图）+ 三个模板外链图床白名单
#   （gw/mdn.alipayobjects.com=布局 logo 与欢迎页图，img.shields.io/react.review=
#   欢迎页徽章）；font-src 的 mdn 域=antd 主题运行时注入的 AlibabaSans 字体
#   （font-src 也是运行时盲区：index.html 构建期无外链≠运行时无外链）。
#   2026-10-19 MCP Chrome 实测：仅 'self' 时这些图全部被 CSP 拦截裂图。新增外链
#   图床须同步本白名单——不要写成 https: 全放开）
# - connect-src 'self'：API/SignalR 全部同源（CSP3 中 'self' 覆盖同源 ws/wss）
# - frame-ancestors 'none' + X-Frame-Options DENY：SPA 无被嵌入场景
# HSTS 刻意未启用：本栈默认纯 HTTP（本地体验）；前端上 TLS 后在终结层开启
#   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://gw.alipayobjects.com https://mdn.alipayobjects.com https://img.shields.io https://react.review; font-src 'self' data: https://mdn.alipayobjects.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

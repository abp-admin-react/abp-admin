# 前端统一入口：SPA 静态资源 + 后端反向代理（后端/数据库/Redis 全部收在 compose 内网，
# 宿主机只暴露本容器的 80 端口）。
#
# 反代路径契约 = web/config/proxy.ts 的 dev 代理清单（前端 dev 模式代理哪些路径，
# 这里就反代哪些，多一条少一条都会在某个功能上断）：
# /api/ /connect/ /.well-known/ /Account/ /Abp/ /libs/ /Themes/ /__bundles/
# /global-styles.css /global-scripts.js /signalr-hubs/（含 WebSocket）
# /images/ 与 /favicon.svg（LeptonXLite 登录页的 logo/favicon 虚拟文件；SPA public/ 无同名文件）。
# OIDC 授权（authority = window.location.origin，见 web/src/abp/env.ts）：浏览器只见
# 前端源，授权/令牌/发现文档全部经本代理抵达后端；后端侧 AuthServer:Authority 与
# 种子的客户端回调地址同指前端源（docker-compose.yml 的 WEB_PUBLIC_URL）。

# WebSocket 升级（SignalR）：无 Upgrade 头的普通请求必须传 close，否则连接挂死
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# SignalR 的 access_token 只能走 query string（浏览器 WS 不能设请求头），默认 combined
# 日志格式会把它记进访问日志。脱敏格式用 $uri（不含 query string）——与
# backend/etc/nginx/signalr-hubs.conf 的既有约定一致；禁用 $request/$request_uri。
log_format signalr_no_token '$remote_addr "$request_method $uri $server_protocol" $status';

server {
    listen 80;
    server_name _;

    # ? nginx ???????????????Location: /xxx/?????????? host:port?
    # ??????? http://localhost/xxx?????? 80????? 8100 ??????????????
    absolute_redirect off;

    # 上游用变量 + Docker 内嵌 DNS 运行期解析：静态 upstream/proxy_pass 只在配置加载时
    # 解析一次服务名，host 容器重建换 IP 后 web 会持续 502；变量形式每次按 valid TTL
    # 重新解析，重建后自愈。（代价：变量 proxy_pass 不支持 upstream keepalive 连接池，
    # 本地/内网栈每请求新建连接，开销可忽略；生产上 TCP 前面还有负载均衡时再权衡。）
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $abpadmin_backend http://host:8080;

    # —— 后端反代（^~ = 前缀命中后不再走正则 location，静态资源的正则缓存规则不会截胡）——

    location ^~ /api/ {
        proxy_pass $abpadmin_backend;
        include /etc/nginx/proxy_params_backend.conf;
        # 上传体积闸门（浏览器请求的唯一入口，先过这里再到后端）。必须 ≥ 后端
        # FileManagement:MaxByteSizeForEachUpload（200MiB，HttpApi.Host appsettings.json）
        # + multipart 编码开销（boundary/每段 header），否则大文件在 nginx 层先被 413
        # 掐掉，后端限额根本没机会生效——此前 100m 就让 100MiB 单文件传不上去。
        # 调后端限额时本行一起改（AbpAdminHttpApiHostModule 的 Kestrel/FormOptions 同步
        # 逻辑也引用该配置）；改完需 docker compose build web 重建（值烘焙进镜像）。
        # 认证端点维持 1m 默认，只给业务 API 放开
        client_max_body_size 210m;
        # 导出/大查询可能较慢，比默认 60s 宽
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # OpenID Connect：发现文档 + 授权/令牌/注销端点。响应体含令牌——关闭压缩，
    # 明文 HTTP 部署下不给 BREACH 类侧信道留面
    location ^~ /.well-known/ {
        proxy_pass $abpadmin_backend;
        include /etc/nginx/proxy_params_backend.conf;
        gzip off;
    }

    location ^~ /connect/ {
        proxy_pass $abpadmin_backend;
        include /etc/nginx/proxy_params_backend.conf;
        gzip off;
    }

    # ABP 账户模块服务端渲染页（登录/注册/找回密码）
    location ^~ /Account/ {
        proxy_pass $abpadmin_backend;
        include /etc/nginx/proxy_params_backend.conf;
    }

    # ABP 虚拟文件体系（封装脚本/主题样式/动态脚本）
    location ^~ /Abp/ {
        proxy_pass $abpadmin_backend;
        include /etc/nginx/proxy_params_backend.conf;
    }

    location ^~ /libs/ {
        proxy_pass $abpadmin_backend;
        include /etc/nginx/proxy_params_backend.conf;
    }

    location ^~ /Themes/ {
        proxy_pass $abpadmin_backend;
        include /etc/nginx/proxy_params_backend.conf;
    }

    # LeptonXLite 登录页引用的主题图片（logo 等，后端虚拟文件体系的匿名静态面，
    # AnonymousEndpointSweepTests 的 wwwroot 白名单条目覆盖）。缺这条时请求落进
    # SPA 静态正则 → 404，登录页 logo 全裂（GUI 实测）；SPA public/ 无 images/ 目录，
    # ^~ 前缀不与 SPA 静态冲突
    location ^~ /images/ {
        proxy_pass $abpadmin_backend;
        include /etc/nginx/proxy_params_backend.conf;
    }

    # LeptonXLite 页面的 favicon（后端虚拟文件）。SPA 自己的是 /favicon.ico（public/），
    # 两个文件互不相干，精确匹配互不干扰
    location = /favicon.svg {
        proxy_pass $abpadmin_backend;
        include /etc/nginx/proxy_params_backend.conf;
    }

    # ABP 打包体系（Bundling）产物：/Account/* 等服务端渲染页引用的主题 CSS/JS，
    # 形如 /__bundles/<name>.<hash>.css?_v=<host进程级版本>。缺这条时请求落进下面
    # SPA 静态正则 location → 404，登录页样式全丢。^~ 前缀优先于正则，同时避开
    # 正则里的 30d 强缓存（缓存语义交给后端 bundle 响应头）；_v 随 host 重建换新，
    # 带旧 _v 的请求后端无法命中、会 302 到登录页——透传即可，nginx 层不做校验/缓存
    location ^~ /__bundles/ {
        proxy_pass $abpadmin_backend;
        include /etc/nginx/proxy_params_backend.conf;
    }

    # 页面全局样式/脚本由后端 bundle 生成（非 SPA 静态文件）
    location = /global-styles.css {
        proxy_pass $abpadmin_backend;
        include /etc/nginx/proxy_params_backend.conf;
    }

    location = /global-scripts.js {
        proxy_pass $abpadmin_backend;
        include /etc/nginx/proxy_params_backend.conf;
    }

    # SignalR：共享反代头 include + WebSocket 升级必备头（本 location 定义了自己的
    # proxy_set_header/超时/缓冲，include 与增量共存）；长读超时 + 关缓冲
    # （要点同 backend/etc/nginx/signalr-hubs.conf）；访问日志用脱敏格式（见文件头）
    location ^~ /signalr-hubs/ {
        proxy_pass $abpadmin_backend;
        include /etc/nginx/proxy_params_backend.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        access_log /var/log/nginx/access.log signalr_no_token;
    }

    # —— SPA 静态资源与前端路由回退 ——
    # 带哈希的构建产物可长缓存；index.html 不缓存（换了构建要立刻生效）
    location ~* \.(js|css|map|svg|png|jpg|jpeg|gif|ico|woff2?|ttf|eot)$ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, immutable";
        # 安全响应头（安全审计 H-5）。注意 nginx 语义：location 内一旦有自己的
        # add_header（上面的 Cache-Control），server 级 add_header 不再被继承——
        # 安全头必须在本 location 重复一份。
        include /etc/nginx/security-headers.conf;
    }

    location / {
        root /usr/share/nginx/html;
        # SPA 前端路由回退到 index.html；umi exportStatic 会为每个路由生成独立 HTML
        #（如 /finance/overview/index.html），故先试 $uri、再试 $uri/index.html、
        # 最后回退根 /index.html。不放 $uri/ 段：它会让 nginx 对无尾斜杠路径发 301
        # 补斜杠重定向，前端路由会多一跳且路径被改写。
        try_files $uri $uri/index.html /index.html;
        # HTML 一律 no-cache（每次回源、带 ETag 再验证走 304）：入口 HTML 引用的是带哈希的
        # chunk 名，被启发式缓存钉住旧版本时，发版后浏览器会长时间跑旧前端（GUI 实测抓到：
        # 容器已换新 chunk，浏览器仍加载旧哈希）。对齐 ABP 官方建议（abp.io/support/465：
        # index.html add_header Cache-Control no-cache——只有带内容哈希的静态产物才长缓存，
        # 即上方正则 location 的 immutable）。注意 nginx 语义：本 location 已有自己的
        # add_header，server 级不再继承——安全头必须在下方 include 里重复，已如此。
        add_header Cache-Control "no-cache";
        # 安全响应头（安全审计 H-5）：SPA 入口与前端路由。反代路径（/api /connect 等）
        # 不经本块——后端响应自带 ABP 的安全头（app.UseAbpSecurityHeaders），避免同头双值。
        include /etc/nginx/security-headers.conf;
    }
}

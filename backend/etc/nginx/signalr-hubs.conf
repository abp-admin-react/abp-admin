# T3.2 SignalR 实时推送的 Nginx 反向代理示例（通知/作业进度/导出完成）。
#
# 用法：把本文件 include 到 server 块内，或将 location 块合并进现有站点配置，
# 并把 http://backend 换成实际的上游地址。
#
# 要点：
# 1. proxy_http_version 1.1 + Upgrade/Connection 头是 WebSocket 升级的必需项。
#    缺了它们 SignalR 会自动降级到 SSE / 长轮询（功能仍在，延迟略高）。
# 2. proxy_read_timeout 默认 60 秒会切断长连接。SignalR 服务端 keep-alive ping
#    默认 15 秒一次、客户端 30 秒未收到判断开；代理超时若小于客户端超时，
#    会出现"代理先切、客户端后知"的窗口，所以必须调大。
# 3. proxy_buffering off 对 Server-Sent Events 降级传输是必需的。
# 4. X-Forwarded-Proto 让后端正确识别 https/wss（后端管道最前已配 UseForwardedHeaders）。
# 5. 【安全】access_token 只能走 query string（浏览器 WebSocket/SSE 不能设请求头），
#    而 Nginx 访问日志默认会记录完整 URI（含 token）。后端中间件会在日志落盘前
#    把 token 从 QueryString 剥除，但 Nginx 这一层必须自行脱敏，例如：
#
#      log_format signalr_no_token $remote_addr' "$request_method '
#                                  '$uri $server_protocol" $status';
#      access_log /var/log/nginx/signalr-access.log signalr_no_token;
#
#    （$uri 不含 query string；不要用 $request_uri / $request。）

location /signalr-hubs/ {
    proxy_pass http://backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
}

# CI 检查后端测试、迁移模型、前端类型与生产构建，并构建 Docker 镜像做验证。
#
# 安全姿态：顶权 contents:read（只读拉代码+跑测试，够用且最小）；第三方/官方 action
# 一律钉 commit SHA（tag 可变，SHA 不可变），升级时换 SHA 并保留版本注释。
name: ci

on:
  push:
    branches: [main]
  pull_request:

# 同分支有新运行时取消旧运行。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Dockerfile restore COPY closure gate
        run: pwsh scripts/check-docker-restore.ps1
      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - name: Restore solution
        # EF 模型检查运行在测试之前，需要先为各迁移项目生成 project.assets.json。
        run: dotnet restore backend/AbpAdmin.slnx
      - name: Restore dotnet-ef
        # .config/dotnet-tools.json 中的工具版本与 EF Core 运行时一致。
        run: dotnet tool restore
      - name: EF model drift check
        # 使用 DbMigrator 启动项目比对七个上下文与各自的迁移快照。
        # 设计时工厂需要连接串生成模型，检查过程不连接数据库。
        env:
          ConnectionStrings__Default: Host=localhost;Database=ef_model_drift_check
        run: |
          dotnet ef migrations has-pending-model-changes \
            -p backend/framework-app/AbpAdmin.EntityFrameworkCore -s backend/framework-app/AbpAdmin.DbMigrator -c AbpAdminDbContext
          dotnet ef migrations has-pending-model-changes \
            -p backend/modules/biz/AbpAdmin.Biz.Template -s backend/framework-app/AbpAdmin.DbMigrator -c BizTemplateDbContext
          dotnet ef migrations has-pending-model-changes \
            -p backend/modules/platform/AbpAdmin.Webhooks -s backend/framework-app/AbpAdmin.DbMigrator -c WebhooksDbContext
          dotnet ef migrations has-pending-model-changes \
            -p backend/modules/platform/AbpAdmin.Collection -s backend/framework-app/AbpAdmin.DbMigrator -c CollectionDbContext
          dotnet ef migrations has-pending-model-changes \
            -p backend/modules/platform/AbpAdmin.Ordering -s backend/framework-app/AbpAdmin.DbMigrator -c OrderingDbContext
          dotnet ef migrations has-pending-model-changes \
            -p backend/modules/platform/AbpAdmin.Ledger -s backend/framework-app/AbpAdmin.DbMigrator -c LedgerDbContext
          dotnet ef migrations has-pending-model-changes \
            -p backend/modules/platform/AbpAdmin.TokenGateway -s backend/framework-app/AbpAdmin.DbMigrator -c TokenGatewayDbContext
      - name: Test
        # 数据库由测试自起：Testcontainers 拉起 postgres:16（每测试进程一个容器，随进程回收），
        # runner 自带 Docker，无需服务容器。含 FrontendContractSnapshotTests（DTO 形状快照）、
        # HostServiceGraphValidationTests（建图零拨号）、RedisStartupPostureTests（首用 fail-fast，
        # 拨 127.0.0.1:1 立即拒绝，runner 上语义相同）——契约快照未同提交刷新时本步必红
        run: dotnet test backend/AbpAdmin.slnx --nologo
      - name: Client error HTTP pipeline (Production)
        env:
          CLIENT_ERROR_TEST_ENVIRONMENT: Production
        run: dotnet test backend/test/AbpAdmin.ClientError.HttpPipeline.Tests/AbpAdmin.ClientError.HttpPipeline.Tests.csproj --nologo

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm tsc
      - name: Test
        run: pnpm test
      - name: Production build
        run: pnpm run build
      - name: Client error demo must be absent from production artifacts
        run: node ../scripts/check-client-error-demo-absent.mjs

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build backend images (Host + DbMigrator)
        # 与本地 scripts/docker-build-check.ps1 同一实现（先闭包门禁再双镜像构建），不在 CI 里再抄一份
        run: pwsh scripts/docker-build-check.ps1
      - name: Validate frontend Docker configuration
        run: |
          docker build -t abp-admin-web:ci ./web
          docker run --rm --network none -e WEB_PUBLIC_URL=http://localhost:8100 abp-admin-web:ci nginx -t

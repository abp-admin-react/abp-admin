# CI 门禁：把仓库的机器契约（后端全量测试——含契约快照/宿主建图/姿态测试，
# 前端类型检查 + vitest）从"本地纪律"升级为"合并前必红/必绿"。刻意保持最小：
# 不发布、不打包，只守门。
#
# 安全姿态：顶权 contents:read（只读拉代码+跑测试，够用且最小）；第三方/官方 action
# 一律钉 commit SHA（tag 可变，SHA 不可变），升级时换 SHA 并保留版本注释。
name: ci

on:
  push:
    branches: [main]
  pull_request:

# 同分支连续 push 只跑最新一次（全量测试 + 双镜像构建较贵，旧跑立即取消）
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Dockerfile restore COPY closure gate
        run: pwsh scripts/check-docker-restore.ps1
      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - name: Restore solution
        # drift check 的 dotnet ef -p 需要 -p 工程的 obj/project.assets.json——dotnet tool restore
        # 只装工具、不还原任何工程的包，全新 runner 上第一条 has-pending-model-changes 必然
        # NETSDK1004（首次真实运行踩到）；后面的 dotnet test 自带隐式 restore，但排在 drift
        # check 之后救不了它。一次全量 restore，五条 -p 工程的 assets 全齐。
        run: dotnet restore backend/AbpAdmin.slnx
      - name: Restore dotnet-ef
        # 五套迁移历史（框架 / Biz.Template / Webhooks / Collection / Ordering）的模型漂移检查用，
        # 版本钉死在 .config/dotnet-tools.json（与 EF Core 运行时同版）
        run: dotnet tool restore
      - name: EF model drift check
        # 实体/配置改了但没 dotnet ef migrations add 时必红——五本迁移账各查一遍。
        # -p 分两区：框架级 backend/framework/，业务模块 backend/modules/；startup 统一走 DbMigrator。
        # 连接串占位由 env 注入：设计时建模不拨号，但工厂解析不到串会直接抛（全新克隆无
        # Database.json/secrets，OCR R2 修复）
        env:
          ConnectionStrings__Default: Host=localhost;Database=ef_model_drift_check
        run: |
          dotnet ef migrations has-pending-model-changes \
            -p backend/framework/AbpAdmin.EntityFrameworkCore -s backend/framework/AbpAdmin.DbMigrator -c AbpAdminDbContext
          dotnet ef migrations has-pending-model-changes \
            -p backend/modules/AbpAdmin.Biz.Template -s backend/framework/AbpAdmin.DbMigrator -c BizTemplateDbContext
          dotnet ef migrations has-pending-model-changes \
            -p backend/framework/AbpAdmin.Webhooks -s backend/framework/AbpAdmin.DbMigrator -c WebhooksDbContext
          dotnet ef migrations has-pending-model-changes \
            -p backend/modules/AbpAdmin.Collection -s backend/framework/AbpAdmin.DbMigrator -c CollectionDbContext
          dotnet ef migrations has-pending-model-changes \
            -p backend/modules/AbpAdmin.Ordering -s backend/framework/AbpAdmin.DbMigrator -c OrderingDbContext
      - name: Test
        # 数据库由测试自起：Testcontainers 拉起 postgres:16（每测试进程一个容器，随进程回收），
        # runner 自带 Docker，无需服务容器。含 FrontendContractSnapshotTests（DTO 形状快照）、
        # HostServiceGraphValidationTests（建图零拨号）、RedisStartupPostureTests（首用 fail-fast，
        # 拨 127.0.0.1:1 立即拒绝，runner 上语义相同）——契约快照未同提交刷新时本步必红
        run: dotnet test backend/AbpAdmin.slnx --nologo

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm tsc
      - name: Test
        run: pnpm test

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build backend images (Host + DbMigrator)
        # 与本地 scripts/docker-build-check.ps1 同一实现（先闭包门禁再双镜像构建），不在 CI 里再抄一份
        run: pwsh scripts/docker-build-check.ps1

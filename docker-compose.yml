# AbpAdmin 全栈一键编排：web 前端（唯一对外入口）+ HttpApi.Host + PostgreSQL + Redis
# + 一次性迁移/种子（DbMigrator）。数据库/缓存/后端全部收在 compose 内网，宿主机只
# 暴露前端端口——浏览器只面对前端源，API/OIDC/SignalR 由前端 nginx 反代进内网
# （路径契约见 web/nginx.conf 头注释）。
#
# 用法（在仓库根目录）：
#   docker compose up -d --build     # 首次构建 + 起栈
#   docker compose logs -f migrator host   # 迁移种子与后端日志
#   docker compose down              # 停栈（数据卷保留）；-v 连数据一起删
# 起来之后：
#   前端/登录/API：http://localhost:8000 （前端源，纯 HTTP，无证书告警；
#   Swagger 默认不经前端暴露——/swagger/ 不在反代清单，见下方 host 服务的 Swagger 注释）
#
# 可用 backend 同级（仓库根）.env 覆盖的变量（不入库）：
#   POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB
#   IDENTITY_ADMIN_PASSWORD
#     首次初始化的 admin 登录口令。本机回环体验默认 1q2w3E*，对外绑定或地址必须自设口令。
#   BIZ_TEMPLATE_SEED_SAMPLE_DATA（默认 false，设为 true 时创建业务模板示例项目）
#   SEED_IDENTITY_UI_DEMO（默认 false，开启部门和声明类型演示）
#   IDENTITY_UI_DEMO_PASSWORD（首次创建演示用户时使用的本地口令）
#   STRING_ENCRYPTION_PASSPHRASE（必填，设置加密使用的随机长字符串；宿主拒绝公开默认值）
#   OPENIDDICT_CERT_PASSPHRASE
#     ⚠ 改 OPENIDDICT_CERT_PASSPHRASE 必须 docker compose build host 重建镜像——
#     openiddict.pfx 在构建期用该口令烘焙加密，只改运行时会让容器拿新口令解旧证书，
#     启动即失败。
#   WEB_HOST_PORT（前端宿主机端口，默认 8000）
#   WEB_BIND（前端绑定的宿主机地址，默认 127.0.0.1——栈内置开发默认口令，不默认暴露 LAN）
#   WEB_PUBLIC_URL（浏览器看到的完整前端源，默认 http://localhost:8000；
#     改端口两处必须一起改：WEB_HOST_PORT=8100 + WEB_PUBLIC_URL=http://localhost:8100——
#     OIDC 授权/令牌/发现端点与客户端回调地址都以它为基准）
#
# 连接默认值（postgres/postgres/abpadmin）只在本栈内自洽：db 健康检查与两个连接串
# 都引用同一组 POSTGRES_* 变量，改 .env 一处全局生效。CI 与本栈不同参：ci.yml 的
# 数据库由测试进程自起 Testcontainers postgres:16（随机凭据）；appsettings.secrets.json
# 是 gitignore 的本机真实凭据，也不与此同步。

name: abp-admin

services:
  # ---- 业务数据库（PostgreSQL 16，仅内网；临时排查用：
  #      docker compose exec db psql -U postgres -d abpadmin） ----
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-abpadmin}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-abpadmin}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # ---- 分布式缓存 / 分布式锁 / DataProtection 密钥环 / SignalR backplane（仅内网） ----
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      # DataProtection 签名密钥环落这里（Production 姿态 Redis:IsEnabled=true）：
      # 持久化避免每次 down/up 令牌全失效
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  # ---- 一次性迁移 + 种子：跑完即退（restart: "no"），后续服务等它成功 ----
  migrator:
    build:
      context: ./backend
      dockerfile: framework-app/AbpAdmin.DbMigrator/Dockerfile
    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=${POSTGRES_DB:-abpadmin};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}"
      # 连同一 Redis：种子写设置（Bootstrap 开关等）的缓存失效才能作用到 Host 读的共享缓存——
      # 不配则失效只落在迁移进程内存，Host 一直读旧值（E2E 实测踩过：开关种了 true Host 读 false）
      Redis__IsEnabled: "true"
      Redis__Configuration: "redis:6379"
      # ABP 设置项加密口令（种子落库的 isEncrypted 设置项用它加密，Host 侧必须同值才能解）
      StringEncryption__DefaultPassPhrase: ${STRING_ENCRYPTION_PASSPHRASE:-dev-only-change-me}
      # OIDC 客户端回调地址种到数据库：SPA/Swagger 的回调都指前端源（浏览器可达的唯一入口）。
      # 环境 key 覆盖会合并进镜像内烘焙的 Host appsettings.json（OpenIddict:Applications 节）
      OpenIddict__Applications__AbpAdmin_App__RootUrl: ${WEB_PUBLIC_URL:-http://localhost:8000}
      OpenIddict__Applications__AbpAdmin_Swagger__RootUrl: ${WEB_PUBLIC_URL:-http://localhost:8000}
      # Frontend port single source = WEB_PUBLIC_URL (CORS + redirect allowlist + OIDC RootUrl).
      App__CorsOrigins: ${WEB_PUBLIC_URL:-http://localhost:8000}
      App__RedirectAllowedUrls: ${WEB_PUBLIC_URL:-http://localhost:8000}
      Identity__AdminPassword: ${IDENTITY_ADMIN_PASSWORD:-}
      # 迁移器仅在前端绑定和公开地址都是回环地址时允许公开的初始口令。
      Identity__LocalDockerBindAddress: ${WEB_BIND:-127.0.0.1}
      # 框架预览栈初始化基础配置。身份和财务演示数据由独立开发环境管理。
      App__SeedDemoData: "false"
      Finance__SeedDemoData: "false"
      App__SeedIdentityUiDemo: ${SEED_IDENTITY_UI_DEMO:-false}
      App__IdentityUiDemoPassword: ${IDENTITY_UI_DEMO_PASSWORD:-}
      BizTemplate__SeedSampleData: ${BIZ_TEMPLATE_SEED_SAMPLE_DATA:-false}
      # 保持 Production，避免随 Development 初始化额外的测试客户端。
      DOTNET_ENVIRONMENT: ${MIGRATOR_DOTNET_ENVIRONMENT:-Production}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # ---- 后端宿主（仅内网）：容器内 https:44395（自签，仅证书挂载用）/ http:8080（前端反代上游） ----
  host:
    build:
      context: ./backend
      dockerfile: framework-app/AbpAdmin.HttpApi.Host/Dockerfile
      args:
        CERT_PASSPHRASE: ${OPENIDDICT_CERT_PASSPHRASE:-dev-only-change-me}
    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=${POSTGRES_DB:-abpadmin};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}"
      # Production 姿态（appsettings.Production.json）Redis:IsEnabled=true、SignalR backplane、
      # Quartz 持久化（qrtz_* 表由迁移器幂等建表）都在这条连接上工作
      Redis__Configuration: "redis:6379"
      StringEncryption__DefaultPassPhrase: ${STRING_ENCRYPTION_PASSPHRASE:-dev-only-change-me}
      AuthServer__CertificatePassPhrase: ${OPENIDDICT_CERT_PASSPHRASE:-dev-only-change-me}
      ASPNETCORE_Kestrel__Certificates__Default__Password: ${OPENIDDICT_CERT_PASSPHRASE:-dev-only-change-me}
      # 对外身份 = 前端源：OIDC issuer/发现文档/授权端点全部经前端反代被浏览器访问，
      # 后端自身不再对外。与 migrator 的回调地址种入值同源（WEB_PUBLIC_URL）
      AuthServer__Authority: ${WEB_PUBLIC_URL:-http://localhost:8000}
      App__SelfUrl: ${WEB_PUBLIC_URL:-http://localhost:8000}
      # Same source as migrator OIDC RootUrl: change WEB_PUBLIC_URL (+ WEB_HOST_PORT) only.
      App__CorsOrigins: ${WEB_PUBLIC_URL:-http://localhost:8000}
      App__RedirectAllowedUrls: ${WEB_PUBLIC_URL:-http://localhost:8000}
      # IP 归属地库：随 Host 镜像携带（见 Host Dockerfile 的 COPY etc/ip2region），
      # 容器内路径相对 ContentRoot=/app 解析——覆盖本地开发用的 ../../etc 相对路径
      IpRegion__DbPath: "etc/ip2region/ip2region_v4.xdb"
      IpRegion__DbPathV6: "etc/ip2region/ip2region_v6.xdb"
      # 前端以 HTTP 对外（本机体验栈）：OpenIddict 放宽传输层强制 HTTPS 并启用
      # X-Forwarded-Proto 处理（模块内既有接线，见 AbpAdminHttpApiHostModule 的
      # RequireHttpsMetadata 分支）。生产前端上 HTTPS 后保持默认 true 即可
      AuthServer__RequireHttpsMetadata: "false"
      # 反代后的真实客户端 IP（安全审计 run-3）：web 边缘是唯一入口且默认追加
      # X-Forwarded-For，但宿主只在钉了 KnownProxies 时才消费 XFF——不钉则所有
      # IP 分区限流（登录/令牌端点/文件分享/GDPR/验证码等）折叠成"全站一个桶"，
      # 任一匿名客户端可替全体用户烧光预算。172.16.0.0/12 覆盖 compose 默认网络
      # （含 web 容器）；模块内钉后自动启用 XForwardedFor 处理（AbpAdminHttpApiHostModule）。
      ForwardedHeaders__KnownProxies: "172.16.0.0/12"
      # Swagger 在非 Development 环境默认关闭，且 /swagger/ 不在前端反代清单里
      # （对外入口只暴露业务路径）。确需经前端访问 Swagger：给本服务加
      # App__EnableSwaggerInProduction=true 并在 web/nginx.conf + web/config/proxy.ts
      # 的路径清单同步加 /swagger/（两处都要）
      # 租户子域名通配回调（*.localhost:8000）在非 Development 环境默认关闭（安全默认，
      # 见 AbpAdminHttpApiHostModule 的 EnableWildcardDomainSupport 门控）；本地体验栈
      # 需要租户子域名登录，显式打开
      App__EnableWildcardDomainSupport: "true"
      # 迁移已由 migrator 完成；宿主自迁移开关关掉（多实例生产姿势）。想让 host 单独
      # 自给自足（不跑 migrator）：删掉本键与 depends_on.migrator 段即可，默认值会自己建表
      Database__AutoMigrateOnStartup: "false"
      # HealthChecks.UI 的轮询端点必须是绝对 URI（消费点 HealthChecksBuilderExtensions
      # 的 AddHealthCheckEndpoint；默认只兜底出相对路径 /health-status，会被拼成 Kestrel
      # 通配地址 https://[::]:44395，自轮询每 10s 刷一条 "GetHealthReport threw an
      # exception ... 0.0.0.0/::0 cannot be used as a target address"）。容器内自探
      # 固定打 http 回环 8080——compose 对 host 的健康探针探的也是同一端点
      App__HealthUiCheckUrl: "http://127.0.0.1:8080/health-status"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    healthcheck:
      # aspnet 运行时镜像没有 curl/wget；/dev/tcp 是 bash 内建（默认 sh=dash 不支持），
      # 必须显式 bash -c。探容器内 8080 的健康端点
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health-status HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ---- web 前端：唯一对外服务（SPA + 后端反代，配置见 web/nginx.conf） ----
  web:
    build:
      context: ./web
    environment:
      WEB_PUBLIC_URL: ${WEB_PUBLIC_URL:-http://localhost:8000}
    ports:
      # 默认只绑宿主机回环：栈内置开发默认口令（postgres/postgres、dev-only-change-me），
      # 不应默认暴露给局域网。要 LAN/外部访问：.env 里 WEB_BIND=0.0.0.0（并自行改掉
      # 全部默认口令 + 给前端上 HTTPS）
      - "${WEB_BIND:-127.0.0.1}:${WEB_HOST_PORT:-8000}:80"
    depends_on:
      host:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "--header", "Host: abpadmin-health", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:

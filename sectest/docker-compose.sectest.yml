# 专用安全测试栈覆盖（sectest）：独立项目 abpadmin-sectest，与维护栈 abp-admin-* 完全隔离
# （独立容器/网络/卷；端口 127.0.0.1:18000 web 边缘、127.0.0.1:18081 直连 host）。
# 用法：
#   WEB_BIND=127.0.0.1 WEB_HOST_PORT=18000 docker compose -p abpadmin-sectest \
#     -f docker-compose.yml -f sectest/docker-compose.sectest.yml up -d --build
# 清理：docker compose -p abpadmin-sectest -f docker-compose.yml -f sectest/docker-compose.sectest.yml down -v
#
# 项目名自钉（安全审计 run-3）：本覆盖把 migrator 强制回 Development 种子姿态并给 host
# 加 nginx 旁路直连口——此前隔离只靠命令行的 -p abpadmin-sectest；漏打 -p 时 Docker Compose
# 会沿用基础文件声明的 name: abp-admin，把开发凭据种子与 18081 直连口合进维护栈（渲染复现：
# project=abp-admin、migrator=Development、host=127.0.0.1:18081），down -v 更会删掉维护栈的
# 数据卷。顶层 name: 在 Compose v2+ 优先于基础文件的同名键（v5.4.0 实测），自钉后即使漏 -p
# 也只会落在一次性栈上。
name: abpadmin-sectest
services:
  migrator:
    # 攻击测试栈显式选开发姿态种子（b08 修复后 compose 默认已是 Production）：
    # 需要默认口令 admin/1q2w3E* + AbpAdmin_TestCli ROPC 客户端作为测试夹具凭据。
    # b08 的验证断言改为检查 compose 渲染默认值=Production（见 sectest.py b08）。
    environment:
      DOTNET_ENVIRONMENT: Development
      MIGRATOR_DOTNET_ENVIRONMENT: Development
  host:
    # 直连 host（绕过 nginx）：匿名面清点、健康端点、部分限流路径需要
    ports:
      - "127.0.0.1:18081:8080"
